const ExplorePage = {
  seq: 0,
  async render(view) {
    const seq = ++this.seq;
    view.innerHTML = `<div class="px-4 sm:px-6 lg:px-8 py-6 pb-36 lg:pb-32 max-w-[1400px] mx-auto">
      ${UI.pageHead("Explore", "Genres, underground heat and curated sets from the open catalog")}
      ${UI.section("Genres", `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">${GENRES.map((g) => genreTile(g)).join("")}</div>`)}
      <div id="explore-under" class="mt-2">${UI.skelRows(5)}</div>
      <div id="explore-pl" class="mt-2">${UI.skelCards(6)}</div>
    </div>`;
    refreshIcons(view);

    const [under, pls] = await Promise.allSettled([Audius.underground(6), Audius.trendingPlaylists("playlist", 8)]);
    if (seq !== this.seq || $("#view").dataset.page !== "explore") return;

    const u = under.status === "fulfilled" ? under.value : [];
    if (u.length) {
      const ctx = Cache.list(Cache.newCtx("under"), u);
      $("#explore-under").outerHTML = UI.section("Underground heat",
        `<div class="rounded-2xl border border-line bg-deep/50 p-2">${u.map((t, i) => UI.trackRow(t, i, ctx, { showGenre: true })).join("")}</div>`,
        { sub: "Breaking tracks bubbling up on Audius", id: "explore-under" });
    } else $("#explore-under").remove();

    const p = pls.status === "fulfilled" ? pls.value : [];
    if (p.length) {
      $("#explore-pl").outerHTML = UI.section("Community playlists", UI.hScroll(p.map((x) => UI.albumCard(x)).join("")), { id: "explore-pl" });
    } else $("#explore-pl").remove();
    refreshIcons(view);
  },
};

const GenrePage = {
  time: "week", seq: 0,
  async render(view, [genreEnc]) {
    const genre = decodeURIComponent(genreEnc || "Electronic");
    const seq = ++this.seq;
    const meta = GENRES.find(([g]) => g === genre) || [genre, "music", "#FF6FAE"];
    view.innerHTML = `<div class="px-4 sm:px-6 lg:px-8 py-6 pb-36 lg:pb-32 max-w-[1400px] mx-auto">
      ${backBtn()}
      <div class="relative overflow-hidden rounded-3xl border border-line p-6 lg:p-10 fade-up" style="background:linear-gradient(135deg, ${meta[2]}2e, #101C3C 65%)">
        <i data-lucide="${meta[1]}" class="absolute -right-4 -bottom-6 w-44 h-44 opacity-15 pointer-events-none" style="color:${meta[2]}"></i>
        <p class="text-[10px] font-bold tracking-[0.3em] uppercase text-mist">Genre</p>
        <h1 class="font-display font-extrabold text-3xl lg:text-5xl tracking-tight mt-2">${esc(genre)}</h1>
        <div class="mt-6 flex gap-2 flex-wrap" id="genre-times">
          ${[["week", "This week"], ["month", "This month"], ["allTime", "All time"]].map(([v, l]) =>
            `<button data-time="${v}" class="px-4 py-2 rounded-full text-xs font-semibold transition ${v === this.time ? "bg-pink text-white" : "bg-white/5 text-mist hover:text-white border border-line"}">${l}</button>`).join("")}
        </div>
      </div>
      <div id="genre-list" class="mt-8">${UI.skelRows(8)}</div>
    </div>`;
    refreshIcons(view);
    const load = async () => {
      const el = $("#genre-list");
      if (!el) return;
      el.innerHTML = UI.skelRows(8);
      try {
        const tracks = await Audius.trending({ genre, time: this.time, limit: 24 });
        if (seq !== this.seq || !document.contains(el)) return;
        if (!tracks.length) { el.innerHTML = UI.empty("disc-3", "No trending tracks in " + genre, "The chart for this genre is quiet right now. Try another time range."); refreshIcons(el); return; }
        const ctx = Cache.list(Cache.newCtx("genre"), tracks);
        el.innerHTML = `
          <div class="flex items-center justify-between mb-3 px-1">
            <p class="text-sm text-mist">${tracks.length} tracks trending</p>
            <button class="px-5 py-2.5 rounded-full bg-pink text-white text-sm font-semibold inline-flex items-center gap-2 hover:bg-blush hover:text-deep transition" data-act="play-ctx" data-ctx="${ctx}"><i data-lucide="play" class="w-4 h-4 fill-current"></i>Play all</button>
          </div>
          <div class="rounded-2xl border border-line bg-deep/50 p-2">${tracks.map((t, i) => UI.trackRow(t, i, ctx, { showGenre: false })).join("")}</div>`;
        refreshIcons(el);
      } catch (_) {
        if (seq !== this.seq) return;
        el.innerHTML = UI.errorState("Could not load the " + genre + " chart.", "genre");
        refreshIcons(el);
      }
    };
    $$("#genre-times [data-time]", view).forEach((b) => (b.onclick = () => {
      this.time = b.dataset.time;
      $$("#genre-times [data-time]", view).forEach((x) => {
        const on = x === b;
        x.className = `px-4 py-2 rounded-full text-xs font-semibold transition ${on ? "bg-pink text-white" : "bg-white/5 text-mist hover:text-white border border-line"}`;
      });
      load();
    }));
    load();
  },
};

function mosaicCover(tracks, sizeCls = "w-12 h-12") {
  const arts = tracks.map((t) => Matcher.bestArt(t) || FALLBACK_ART).slice(0, 4);
  if (!arts.length) return `<span class="${sizeCls} rounded-xl bg-navy grid place-items-center text-pink shrink-0"><i data-lucide="list-music" class="w-1/2 h-1/2"></i></span>`;
  if (arts.length === 1) return `<img src="${esc(arts[0])}" onerror="imgFallback(this)" alt="" class="${sizeCls} rounded-xl object-cover bg-navy shrink-0" />`;
  return `<span class="${sizeCls} rounded-xl overflow-hidden grid grid-cols-2 grid-rows-2 shrink-0">${arts.map((a) => `<img src="${esc(a)}" onerror="imgFallback(this)" alt="" class="w-full h-full object-cover" loading="lazy" />`).join("")}</span>`;
}

          <div class="qrow flex items-center gap-2 rounded-xl bg-deep/50 border border-line p-1.5" draggable="true" data-i="${i}">

            <div class="flex-1 min-w-0">${UI.trackRow(t, i, ctx)}</div>
            <button class="q-up p-2 rounded-lg text-mist hover:text-white hover:bg-navy transition" aria-label="Move up"><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
            <button class="q-down p-2 rounded-lg text-mist hover:text-white hover:bg-navy transition" aria-label="Move down"><i data-lucide="arrow-down" class="w-4 h-4"></i></button>
            <button class="q-del p-2 rounded-lg text-mist hover:text-[#ff8fa3] hover:bg-navy transition" aria-label="Remove from queue"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>`).join("")}
      </div>
    </div>`;
    refreshIcons(view);
    $("#q-clear").onclick = () => { Player.clearQueue(false); Router.render(true); };
    $("#q-save").onclick = () => {
      const pl = Library.createPlaylist("Queue · " + new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" }), [...q]);
      Toast.show("Saved as “" + pl.name + "”", "list-plus");
    };
    let dragI = null;
    $$("#q-list .qrow").forEach((row) => {
      const i = +row.dataset.i;
      row.querySelector(".q-up").onclick = () => Player.move(i, i - 1);
      row.querySelector(".q-down").onclick = () => Player.move(i, i + 1);
      row.querySelector(".q-del").onclick = () => Player.removeAt(i);
      row.addEventListener("dragstart", () => (dragI = i));
      row.addEventListener("dragover", (e) => { e.preventDefault(); row.classList.add("drag-over"); });
      row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
      row.addEventListener("drop", (e) => { e.preventDefault(); row.classList.remove("drag-over"); if (dragI != null) Player.move(dragI, i); });
    });
  },
};

/* ================================================================
   §11 · router.js — hash router; audio keeps playing between pages
   ================================================================ */
const Router = {
  lastHash: null,
  stack: [],          // in-app back history (previous hashes)
  _back: false,       // true when the next render is a back-navigation
  canBack() { return this.stack.length > 0; },
  back() {
    const prev = this.stack.pop() || "#/home";
    this._back = true;
    location.hash = prev;
  },
  parseHash() {
    const raw = location.hash.replace(/^#\/?/, "") || "home";
    return raw.split("/").filter(Boolean);
  },
  setNav(key) {
    const map = { genre: "explore", artist: "", album: "", playlist: "library" };
    const k = key in map ? map[key] : key;
    $$(".navlink").forEach((a) => a.classList.toggle("active", a.dataset.nav === k && k !== ""));
    $$(".mnav").forEach((a) => { const on = a.dataset.nav === k; a.classList.toggle("text-pink", on); a.classList.toggle("text-mist", !on); });
  },
  async render(keepScroll) {
    const hash = location.hash || "#/home";
    if (keepScroll === undefined) keepScroll = hash === this.lastHash;
    if (this._back) this._back = false;                                  // came back via back() — don't re-push
    else if (this.lastHash && this.lastHash !== hash) {
      this.stack.push(this.lastHash);
      if (this.stack.length > 50) this.stack.shift();
    }
    this.lastHash = hash;
    const seg = this.parseHash();
    const page = seg[0] || "home";
    this.setNav(page);
    Menu.close();
    const view = $("#view");
    view.dataset.page = page;
    const st = view.scrollTop;
    try {
      switch (page) {
        case "home":    await HomePage.render(view); break;
        case "search":  await SearchPage.render(view); break;
        case "explore": await ExplorePage.render(view); break;
        case "genre":   await GenrePage.render(view, seg.slice(1)); break;
        case "library": LibraryPage.render(view); break;
        case "liked":   LikedPage.render(view); break;
        case "recent":  RecentPage.render(view); break;
        case "queue":   QueuePage.render(view); break;
        case "playlist":PlaylistPage.render(view, seg[1]); break;
        case "album":   await AlbumPage.render(view, seg[1]); break;
        case "artist":  await ArtistPage.render(view, seg[1]); break;
        default:        await HomePage.render(view);
      }
    } catch (err) {
      view.innerHTML = `<div class="px-6 py-10">${UI.errorState("This page could not be rendered.", "page")}</div>`;
    }
    renderDevFooter(view);
    refreshIcons(view);
    view.scrollTop = keepScroll ? st : 0;
  },
};
window.addEventListener("hashchange", () => { $("#np")?.classList.remove("open"); Router.render(); });

    </div>
  </div>`;
  view.appendChild(f);
  refreshIcons(f);
}

/* ================================================================
   §12 · app.js — boot sequence
   ================================================================ */
async function restoreQueue() {
  const q = Store.data.queue;
  if (!q || !Array.isArray(q.ids) || !q.ids.length) return;
  try {
    const tracks = await Audius.tracksByIds(q.ids);
    if (!tracks.length) return;
    const byId = new Map(tracks.map((t) => [t.id, t]));
    Player.queue = q.ids.map((id) => byId.get(id)).filter(Boolean);
    if (!Player.queue.length) return;
    Player.index = clamp(q.index ?? 0, 0, Player.queue.length - 1);
    Player.ctxName = q.ctx;
    Player.dirty = true;                    // media loads on first play press
    emit("queue"); emit("track", Player.current);
  } catch (_) { /* offline at boot — fine */ }
}

function bindChrome() {
  $("#nav-back")?.addEventListener("click", () => history.back());
  $("#nav-fwd")?.addEventListener("click", () => history.forward());
  $("#m-search-btn")?.addEventListener("click", () => { location.hash = "#/search"; });
  $("#sb-create-pl")?.addEventListener("click", () => createPlaylistModal());
  const gs = $("#global-search");
  if (gs) gs.addEventListener("input", debounce(() => {
    const q = gs.value.trim();
    SearchPage.q = q;
    if (Router.parseHash()[0] !== "search") { if (q) location.hash = "#/search"; }
    else SearchPage.run(q);
  }, 350));
  /* keep sidebar nav highlight snappy */
  $$(".navlink, .mnav").forEach((a) => a.addEventListener("click", () => {
    const key = a.dataset.nav;
    setTimeout(() => Router.setNav(key), 0);
  }));
}

async function boot() {
  bindPlayerUI();
  bindShortcuts();
  bindGlobalDelegation();
  bindChrome();
  renderSidebarPlaylists();
  syncPrefsUI();
  syncTrackUI();
  if (!location.hash) location.hash = "#/home";   // hashchange fires → renders → footer
  else await Router.render();                     // deep-link load → render once
  refreshIcons();
  restoreQueue();
}
boot();
</script>
