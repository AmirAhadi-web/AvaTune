<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AvaTune</title>
<meta name="description" content="AvaTune is a modern music discovery & streaming player. Audio via the Audius API, catalog metadata via the iTunes Search API." />
<meta name="theme-color" content="#0A1230" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<style type="text/tailwindcss">
@theme {
  --color-ink: #0A1230;        /* page background         */
  --color-deep: #101C3C;      /* deep blue surface       */
  --color-navy: #1B2B52;      /* secondary blue surface  */
  --color-lift: #16244B;      /* raised card hover       */
  --color-line: rgba(170,183,208,.12);
  --color-pink: #FF6FAE;      /* bubblegum pink accent   */
  --color-blush: #FFB4D2;     /* soft pink               */
  --color-mist: #AAB7D0;      /* muted text              */
  --font-display: "Sora", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, sans-serif;
}
</style>

<style>
/* ================================================================
   AFTERGLOW · DESIGN SYSTEM  (src/styles/input.css equivalent)
   ================================================================ */
:root { color-scheme: dark; }
* { -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: #0A1230;
  color: #fff;
  font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
  overflow: hidden;
}
::selection { background: rgba(255,111,174,.35); }

/* ---------- scrollbars ---------- */
.scroll-slim { scrollbar-width: thin; scrollbar-color: #26355e transparent; }
.scroll-slim::-webkit-scrollbar { width: 10px; height: 10px; }
.scroll-slim::-webkit-scrollbar-thumb { background: #26355e; border-radius: 99px; border: 3px solid #0A1230; }
.scroll-slim::-webkit-scrollbar-track { background: transparent; }
.no-scrollbar { scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }

/* ---------- typography helpers ---------- */
.font-display { font-family: "Sora", ui-sans-serif, system-ui, sans-serif; }
.line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- focus ---------- */
:focus-visible { outline: 2px solid #FF6FAE; outline-offset: 2px; border-radius: 6px; }
button { cursor: pointer; }

/* ---------- app frame ---------- */
#shell { display:block; }
@media (min-width: 1024px) {
  #shell { display:grid; grid-template-columns: 264px minmax(0,1fr); }
  #view-wrap { height: calc(100vh - 92px); }
}
#view { -webkit-overflow-scrolling: touch; }
@media (max-width: 1023.98px) { #view::after { content: ""; display: block; height: 70px; } }
@media (max-width: 1023.98px) { #view::after { content: ""; display: block; height: 76px; } }

/* ---------- cards & rows ---------- */
.card {
  background: #101C3C;
  border: 1px solid rgba(170,183,208,.10);
  transition: transform .25s cubic-bezier(.2,.7,.2,1), background .25s, border-color .25s, box-shadow .25s;
}
.card:hover { background: #16244B; border-color: rgba(170,183,208,.2); transform: translateY(-3px); box-shadow: 0 18px 40px -18px rgba(2,6,20,.85); }
.trow { transition: background .18s ease; border-radius: 10px; }
.trow:hover, .trow:focus-visible { background: rgba(27,43,82,.72); }
.trow.playing { background: linear-gradient(90deg, rgba(255,111,174,.13), rgba(27,43,82,.35)); }
.trow.playing .trow-title { color: #FFB4D2; }

/* play button reveal on hover for cards */
.card .hover-play { opacity: 0; transform: translateY(10px); transition: opacity .22s ease, transform .22s cubic-bezier(.2,.8,.2,1); }
.card:hover .hover-play, .card:focus-within .hover-play { opacity: 1; transform: translateY(0); }
@media (hover: none) { .card .hover-play { opacity: 1; transform: none; } }

/* ---------- skeletons ---------- */
.sk { position: relative; overflow: hidden; background: #16224a; }
.sk::after {
  content:""; position:absolute; inset:0;
  background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.07) 50%, transparent 80%);
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer { from { transform: translateX(-100%);} to { transform: translateX(100%);} }

/* ---------- range inputs ---------- */
input[type="range"].ag { -webkit-appearance:none; appearance:none; background:transparent; height:20px; width:100%; }
input[type="range"].ag::-webkit-slider-runnable-track {
  height: 4px; border-radius: 99px;
  background: linear-gradient(to right, #FF6FAE 0%, #FF6FAE var(--fill,0%), rgba(170,183,208,.25) var(--fill,0%), rgba(170,183,208,.25) 100%);
}
input[type="range"].ag::-webkit-slider-thumb {
  -webkit-appearance:none; width:13px; height:13px; margin-top:-4.5px; border-radius:99px;
  background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.5); opacity:0; transition:opacity .15s;
}
input[type="range"].ag:hover::-webkit-slider-thumb, input[type="range"].ag:focus-visible::-webkit-slider-thumb, .always-thumb input[type="range"].ag::-webkit-slider-thumb { opacity:1; }
input[type="range"].ag::-moz-range-track { height:4px; border-radius:99px; background: rgba(170,183,208,.25); }
input[type="range"].ag::-moz-range-progress { height:4px; border-radius:99px; background:#FF6FAE; }
input[type="range"].ag::-moz-range-thumb { width:13px; height:13px; border:none; border-radius:99px; background:#fff; opacity:0; }
input[type="range"].ag:hover::-moz-range-thumb, .always-thumb input[type="range"].ag::-moz-range-thumb { opacity:1; }

/* ---------- equalizer / visualizer bars ---------- */
.eqbar { transform-origin: bottom; background: linear-gradient(to top,#FF6FAE,#FFB4D2); border-radius: 2px 2px 0 0; width: 3px; height: 4px; transition: height .09s linear; }
@keyframes eqfall { 0%,100% { height: 18%; } 50% { height: 85%; } }
.eqfake .eqbar { animation: eqfall 1s ease-in-out infinite; }
.eqfake .eqbar:nth-child(1){ animation-delay: -.9s } .eqfake .eqbar:nth-child(2){ animation-delay: -.5s }
.eqfake .eqbar:nth-child(3){ animation-delay: -.2s } .eqfake .eqbar:nth-child(4){ animation-delay: -.7s }
.eqfake .eqbar:nth-child(5){ animation-delay: -.35s } .eqfake .eqbar:nth-child(6){ animation-delay: -.6s }
.eqfake .eqbar:nth-child(7){ animation-delay: -.1s } .eqfake .eqbar:nth-child(8){ animation-delay: -.8s }
.eqpaused .eqbar { animation-play-state: paused; height: 14% !important; }
@keyframes spin { to { transform: rotate(360deg); } }
.is-loading #np-play .icon-pause, .is-loading .spin-me { animation: spin 1s linear infinite; }

/* ---------- now playing overlay ---------- */
#np { transform: translateY(102%); transition: transform .45s cubic-bezier(.32,.72,.24,1); will-change: transform; }
#np.open { transform: translateY(0); }
.np-amb { filter: blur(90px) saturate(1.5); opacity:.5; transform: scale(1.4); }

/* ---------- context menu / modal / toast ---------- */
#menu-root > .menu { animation: pop .16s cubic-bezier(.2,.8,.2,1); }
@keyframes pop { from { opacity:0; transform: scale(.94) translateY(6px);} }
.modal-bg { animation: fadein .18s ease; }
.modal-card { animation: pop .18s cubic-bezier(.2,.8,.2,1); }
@keyframes fadein { from { opacity: 0; } }
@keyframes toast-in { from { opacity:0; transform: translateY(14px) scale(.95); } }
.toast { animation: toast-in .25s cubic-bezier(.2,.8,.2,1); }
.toast.out { opacity:0; transform: translateY(8px); transition: all .3s ease; }

/* ---------- misc anims ---------- */
@keyframes fadeUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform:none; } }
.fade-up { animation: fadeUp .5s cubic-bezier(.2,.7,.2,1) both; }
@keyframes pulsedot { 0%,100%{opacity:1} 50%{opacity:.35} }
.live-dot { animation: pulsedot 2.2s ease-in-out infinite; }
.marquee:hover .marquee-inner { animation: scrolltxt 8s linear infinite; }
@keyframes scrolltxt { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

/* nav active state */
.navlink { position: relative; transition: color .2s, background .2s; }
.navlink.active { color:#fff; background: rgba(255,111,174,.10); }
.navlink.active::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:99px; background:#FF6FAE; }
.navlink:hover { color:#fff; }

/* drag highlight for queue */
.drag-over { outline: 2px dashed #FF6FAE; outline-offset: -2px; }

/* like heart pulse */
@keyframes heartpop { 0%{transform:scale(.6)} 55%{transform:scale(1.25)} 100%{transform:scale(1)} }
.heart-pop { animation: heartpop .35s cubic-bezier(.2,.8,.2,1); }

/* artwork glow ring on now playing */
.np-art { box-shadow: 0 30px 90px -20px rgba(255,111,174,.28), 0 20px 60px -30px rgba(0,0,0,.9); }
img { user-select: none; -webkit-user-drag: none; }
</style>
</head>

<body class="font-body antialiased text-white">
<!-- ==============================================================
     APP SHELL · layout regions
     ============================================================== -->
<div id="shell" class="h-[100dvh]">
  <!-- ============ SIDEBAR (desktop) ============ -->
  <aside class="hidden lg:flex flex-col bg-[#0C1636] border-r border-line h-full overflow-hidden">
    <div class="px-5 pt-6 pb-4 flex items-center gap-3">
      <svg viewBox="0 0 48 48" class="w-10 h-10 shrink-0" style="filter:drop-shadow(0 8px 20px rgba(255,111,174,.45))" role="img" aria-label="AvaTune logo"><defs><linearGradient id="ava-g1" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#FFB4D2"/><stop offset=".55" stop-color="#FF6FAE"/><stop offset="1" stop-color="#E14E8F"/></linearGradient></defs><path fill-rule="evenodd" fill="url(#ava-g1)" d="M24 4 44 42h-9.6L24 20.6 13.6 42H4Z M21.2 26.8 28.4 32l-7.2 5.2Z"/></svg>
      <div>
        <div class="font-display text-2xl leading-none tracking-tight" style="font-weight:800">AvaTune</div>
        <div class="text-[10px] uppercase tracking-[0.2em] text-mist mt-1.5">Open Music Player</div>
      </div>
    </div>

    <nav class="px-3 mt-2" aria-label="Primary">
      <p class="px-3 pb-2 text-[10px] font-semibold tracking-[0.22em] text-mist/70">MENU</p>
      <a href="#/home"    data-nav="home"    class="navlink flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-mist"><i data-lucide="home" class="w-[18px] h-[18px]"></i>Home</a>
      <a href="#/search"  data-nav="search"  class="navlink flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-mist"><i data-lucide="search" class="w-[18px] h-[18px]"></i>Search</a>
      <a href="#/explore" data-nav="explore" class="navlink flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-mist"><i data-lucide="compass" class="w-[18px] h-[18px]"></i>Explore</a>
    </nav>

    <nav class="px-3 mt-6" aria-label="Library">
      <p class="px-3 pb-2 text-[10px] font-semibold tracking-[0.22em] text-mist/70">LIBRARY</p>
      <a href="#/library" data-nav="library" class="navlink flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-mist"><i data-lucide="library" class="w-[18px] h-[18px]"></i>Your Library</a>
      <a href="#/liked"   data-nav="liked"   class="navlink flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-mist"><i data-lucide="heart" class="w-[18px] h-[18px]"></i>Liked Songs</a>
      <a href="#/recent"  data-nav="recent"  class="navlink flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-mist"><i data-lucide="history" class="w-[18px] h-[18px]"></i>Recently Played</a>
      <a href="#/queue"   data-nav="queue"   class="navlink flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-mist"><i data-lucide="list-music" class="w-[18px] h-[18px]"></i>Queue</a>
    </nav>

    <div class="px-3 mt-6 flex items-center justify-between">
      <p class="px-3 text-[10px] font-semibold tracking-[0.22em] text-mist/70">PLAYLISTS</p>
      <button id="sb-create-pl" class="p-1.5 mr-1 rounded-lg text-mist hover:text-white hover:bg-navy transition" title="Create playlist" aria-label="Create playlist">
        <i data-lucide="plus" class="w-4 h-4"></i>
      </button>
    </div>
    <div id="sb-playlists" class="px-3 mt-1 flex-1 overflow-y-auto scroll-slim pb-4"></div>

    <div class="px-6 py-4 border-t border-line text-[11px] leading-relaxed text-mist/70">
      Audio via <a class="text-blush hover:text-pink transition" href="https://audius.co" target="_blank" rel="noopener">Audius</a> ·
      Metadata via <a class="text-blush hover:text-pink transition" href="https://performance-partners.apple.com/search-api" target="_blank" rel="noopener">iTunes Search API</a>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div id="view-wrap" class="relative flex flex-col h-[100dvh] lg:h-auto min-w-0">
    <header class="hidden lg:flex items-center gap-3 px-6 py-3.5 bg-[#0A1230]/85 backdrop-blur-xl border-b border-line z-30">
      <div class="flex items-center gap-1.5">
        <button id="nav-back" class="p-2 rounded-full text-mist hover:text-white hover:bg-navy transition" aria-label="Go back"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
        <button id="nav-fwd" class="p-2 rounded-full text-mist hover:text-white hover:bg-navy transition" aria-label="Go forward"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
      </div>
      <div class="relative flex-1 max-w-md">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-mist pointer-events-none"></i>
        <input id="global-search" type="search" placeholder="Search tracks, artists, albums…" autocomplete="off"
          class="w-full bg-deep border border-line rounded-full pl-10 pr-4 py-2.5 text-sm placeholder:text-mist/60 focus:border-pink/60 transition" />
      </div>
      <div class="ml-auto hidden xl:flex items-center gap-2 text-xs text-mist/70">
        <span class="w-1.5 h-1.5 rounded-full bg-pink live-dot"></span>
        <span id="clock-label">Streaming via Audius</span>
      </div>
    </header>

    <!-- Mobile top bar -->
    <header class="lg:hidden flex items-center gap-3 px-4 pt-4 pb-3 bg-[#0A1230]/90 backdrop-blur-xl border-b border-line z-30">
      <svg viewBox="0 0 48 48" class="w-8 h-8 shrink-0" style="filter:drop-shadow(0 6px 16px rgba(255,111,174,.45))" role="img" aria-label="AvaTune logo"><defs><linearGradient id="ava-g2" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#FFB4D2"/><stop offset=".55" stop-color="#FF6FAE"/><stop offset="1" stop-color="#E14E8F"/></linearGradient></defs><path fill-rule="evenodd" fill="url(#ava-g2)" d="M24 4 44 42h-9.6L24 20.6 13.6 42H4Z M21.2 26.8 28.4 32l-7.2 5.2Z"/></svg>
      <div class="font-display font-extrabold tracking-tight text-lg">AvaTune</div>
      <button id="m-search-btn" class="ml-auto p-2 rounded-lg text-mist hover:text-white hover:bg-navy transition" aria-label="Search"><i data-lucide="search" class="w-5 h-5"></i></button>
    </header>

    <main id="view" class="flex-1 overflow-y-auto scroll-slim min-h-0" tabindex="-1"></main>
  </div>
</div>

<!-- ==============================================================
     DESKTOP PLAYER BAR
     ============================================================== -->
<footer id="playerbar" class="hidden lg:flex fixed bottom-0 inset-x-0 h-[92px] bg-[#0C1636]/95 backdrop-blur-xl border-t border-line z-40 items-center gap-4 px-4">
  <!-- current track -->
  <div class="flex items-center gap-3 w-[30%] min-w-0">
    <button id="pb-art-btn" class="relative shrink-0 group" aria-label="Open now playing">
      <img id="pb-art" src="" alt="" class="w-14 h-14 rounded-lg object-cover bg-navy transition group-hover:brightness-75" />
      <span class="absolute inset-0 grid place-items-center opacity-0 group-hover:opacity-100 transition"><i data-lucide="chevrons-up" class="w-5 h-5"></i></span>
    </button>
    <div class="min-w-0">
      <div id="pb-title" class="text-sm font-semibold line-clamp-1">Nothing playing</div>
      <button id="pb-artist" class="text-xs text-mist hover:text-blush transition line-clamp-1 text-left max-w-full">Pick something to listen to</button>
    </div>
    <button id="pb-like" class="p-2 rounded-full text-mist hover:text-pink transition shrink-0" aria-label="Like track"><i data-lucide="heart" class="w-[18px] h-[18px]"></i></button>
  </div>

  <!-- transport -->
  <div class="flex flex-col items-center flex-1 max-w-[46%] gap-1">
    <div class="flex items-center gap-2">
      <button id="pb-shuffle" class="p-2 rounded-full text-mist hover:text-white transition relative" aria-label="Shuffle"><i data-lucide="shuffle" class="w-4 h-4"></i></button>
      <button id="pb-prev" class="p-2 rounded-full text-mist hover:text-white transition" aria-label="Previous track"><i data-lucide="skip-back" class="w-5 h-5 fill-current"></i></button>
      <button id="pb-play" class="w-10 h-10 rounded-full bg-white text-[#101C3C] grid place-items-center hover:scale-105 hover:bg-blush active:scale-95 transition" aria-label="Play or pause"><i data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i></button>
      <button id="pb-next" class="p-2 rounded-full text-mist hover:text-white transition" aria-label="Next track"><i data-lucide="skip-forward" class="w-5 h-5 fill-current"></i></button>
      <button id="pb-repeat" class="p-2 rounded-full text-mist hover:text-white transition relative" aria-label="Repeat mode"><i data-lucide="repeat" class="w-4 h-4"></i></button>
    </div>
    <div class="flex items-center gap-2.5 w-full">
      <span id="pb-cur" class="text-[11px] tabular-nums text-mist w-9 text-right">0:00</span>
      <input id="pb-seek" type="range" class="ag flex-1" min="0" max="1000" value="0" step="1" aria-label="Seek" />
      <span id="pb-dur" class="text-[11px] tabular-nums text-mist w-9">0:00</span>
    </div>
  </div>

  <!-- right cluster -->
  <div class="flex items-center gap-1.5 w-[30%] justify-end">
    <div id="viz" class="hidden xl:flex items-end gap-[3px] h-5 w-12 mr-1" aria-hidden="true"></div>
    <button id="pb-queue" class="p-2 rounded-full text-mist hover:text-white transition" aria-label="Queue" title="Queue"><i data-lucide="list-music" class="w-[18px] h-[18px]"></i></button>
    <button id="pb-lyrics" class="p-2 rounded-full text-mist hover:text-white transition" aria-label="Lyrics" title="Lyrics"><i data-lucide="mic-vocal" class="w-[18px] h-[18px]"></i></button>
    <button id="pb-mute" class="p-2 rounded-full text-mist hover:text-white transition" aria-label="Mute"><i data-lucide="volume-2" class="w-[18px] h-[18px]"></i></button>
    <div class="w-24 always-thumb"><input id="pb-vol" type="range" class="ag" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" /></div>
    <button id="pb-expand" class="p-2 rounded-full text-mist hover:text-white transition" aria-label="Expand player"><i data-lucide="maximize-2" class="w-4 h-4"></i></button>
  </div>
</footer>

<!-- ==============================================================
     MOBILE: MINI PLAYER + BOTTOM NAV
     ============================================================== -->
<div class="lg:hidden fixed bottom-0 inset-x-0 z-40">
  <div id="mini" class="hidden mx-2 mb-2 rounded-2xl bg-[#1B2B52]/95 backdrop-blur-xl border border-line shadow-[0_10px_40px_-10px_rgba(0,0,0,.8)] overflow-hidden">
    <div class="relative h-[58px] flex items-center gap-1 px-2">
      <img id="mp-art" src="" alt="" class="w-10 h-10 rounded-[10px] object-cover bg-ink shrink-0 ring-1 ring-white/10" />
      <div class="min-w-0 flex-1 mr-1">
        <div id="mp-title" class="text-[13px] font-semibold line-clamp-1"></div>
        <div id="mp-artist" class="text-[11px] text-mist line-clamp-1"></div>
      </div>
      <div class="flex items-center shrink-0">
        <button id="mp-shuffle" class="relative p-2.5 text-mist active:scale-90 transition" aria-label="Shuffle"><i data-lucide="shuffle" class="w-[17px] h-[17px]"></i></button>
        <button id="mp-prev" class="p-2.5 text-mist active:scale-90 transition" aria-label="Previous track"><i data-lucide="skip-back" class="w-[20px] h-[20px] fill-current"></i></button>
        <button id="mp-play" class="w-10 h-10 mx-0.5 rounded-full bg-white text-deep grid place-items-center shadow-[0_4px_16px_-4px_rgba(255,180,210,.5)] active:scale-90 transition" aria-label="Play or pause"><i data-lucide="play" class="w-[18px] h-[18px] fill-current ml-0.5"></i></button>
        <button id="mp-next" class="p-2.5 text-mist active:scale-90 transition" aria-label="Next track"><i data-lucide="skip-forward" class="w-[20px] h-[20px] fill-current"></i></button>
        <button id="mp-repeat" class="relative p-2.5 hidden min-[420px]:block text-mist active:scale-90 transition" aria-label="Repeat mode"><i data-lucide="repeat" class="w-[17px] h-[17px]"></i></button>
        <button id="mp-like" class="p-2.5 hidden min-[420px]:block text-mist active:scale-90 transition" aria-label="Like"><i data-lucide="heart" class="w-[18px] h-[18px]"></i></button>

<!-- single shared audio element for the entire app -->

<script>
"use strict";
/*  ================================================================
    AFTERGLOW · application modules
    Single-file build — the sections below mirror the requested
    modular project structure one-to-one:

      §1  utils/          helpers, debounce, formatTime
      §2  storage/        versioned localStorage schema
      §3  state.js        event bus, track cache, list contexts
      §4  components/     toast, icons        (more in later chunks)
      §5  api/audius.js   streaming + discovery      [chunk 2]
      §6  api/itunes.js   metadata + artwork         [chunk 2]
      §7  api/matcher.js  Audius ⇄ iTunes matching   [chunk 2]
      §8  audio/engine    centralized audio engine   [chunk 3]
      §9  components/     player, menus, modals      [chunk 3]
      §10 pages/ + router all views                  [chunk 4]
    ================================================================ */

/* ================================================================
   §1 · utils/ — helpers.js, debounce.js, formatTime.js
   ================================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const debounce = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
const fmtNum = (n) => {
  n = +n || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
};
const timeAgo = (ts) => {
  const d = Date.now() - ts, m = 6e4, h = 36e5, day = 864e5;
  if (d < m) return "just now";
  if (d < h) return Math.floor(d / m) + "m ago";
  if (d < day) return Math.floor(d / h) + "h ago";
  if (d < day * 7) return Math.floor(d / day) + "d ago";
  return new Date(ts).toLocaleDateString("en-US", { month: "short", day: "numeric" });
};
const uid = () => "pl-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* Fallback artwork (palette-consistent, inline so it never 404s) */
const FALLBACK_ART = "data:image/svg+xml," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#1B2B52'/><stop offset='1' stop-color='#101C3C'/></linearGradient></defs><rect width='600' height='600' fill='url(#g)'/><g stroke='#FF6FAE' stroke-width='16' stroke-linecap='round' opacity='.85'><path d='M250 340v-90M300 380v-160M350 320v-40'/></g><circle cx='300' cy='460' r='7' fill='#FFB4D2'/></svg>`);
window.imgFallback = (el) => { el.onerror = null; if (el.src !== FALLBACK_ART) el.src = FALLBACK_ART; };

/* ================================================================
   §2 · storage/localStorage.js — versioned, hardened persistence
   ================================================================ */
const Store = {
  KEY: "afterglow.v1",
  defaults: () => ({
    v: 1,
    liked: {},            // id -> {track, at}
    likedOrder: [],       // ids, newest first
    playlists: [],        // {id,name,createdAt,tracks:[track]}
    recent: [],           // [{track, at}]
    prefs: { volume: 0.8, muted: false, shuffle: false, repeat: "off" },
    queue: { ctx: null, ids: [], index: -1 },
  }),
  data: null,
  load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(this.KEY)); } catch (_) { raw = null; }
    const d = this.defaults();
    if (raw && typeof raw === "object" && raw.v === 1) {
      this.data = {
        v: 1,
        liked:        raw.liked && typeof raw.liked === "object" ? raw.liked : {},
        likedOrder:   Array.isArray(raw.likedOrder) ? raw.likedOrder.filter(Boolean) : [],
        playlists:    Array.isArray(raw.playlists) ? raw.playlists.filter(p => p && p.id && Array.isArray(p.tracks)) : [],
        recent:       Array.isArray(raw.recent) ? raw.recent.filter(r => r && r.track && r.track.id) : [],
        prefs:        Object.assign(d.prefs, raw.prefs || {}),
        queue:        raw.queue && Array.isArray(raw.queue.ids) ? raw.queue : d.queue,
      };
    } else this.data = d;
    return this.data;
  },
  save() {
    try {
      const d = this.data;
      /* budget: keep localStorage light — cap lists */
      if (d.recent.length > 60) d.recent.length = 60;
      localStorage.setItem(this.KEY, JSON.stringify(d));
    } catch (_) { /* storage full or blocked — degrade silently */ }
  },
};
Store.load();

/* ================================================================
   §3 · state.js — event bus + runtime caches
   ================================================================ */
const Bus = new EventTarget();
const emit = (name, detail) => Bus.dispatchEvent(new CustomEvent(name, { detail }));
const on   = (name, fn) => Bus.addEventListener(name, (e) => fn(e.detail));

const Cache = {
  tracks: new Map(),   // id -> normalized track (runtime registry)
  lists:  new Map(),   // ctxId -> [trackIds] (the list a row belongs to)
  seq: 0,
  put(t) { if (t && t.id) this.tracks.set(t.id, t); return t; },
  list(ctx, tracks) { tracks.forEach((t) => this.put(t)); this.lists.set(ctx, tracks.filter(Boolean).map((t) => t.id)); return ctx; },
  newCtx(prefix) { return `${prefix}-${++this.seq}`; },
};

/* normalize an Audius API track object → internal track model */
function T(t) {
  if (!t || !t.id) return null;
  const a = t.artwork || {}, u = t.user || {};
  return Cache.put({
    src: "audius",
    id: t.id,
    title: t.title || "Unknown title",
    artist: u.name || "Unknown artist",
    artistId: u.id || null,
    handle: u.handle || "",
    verified: !!u.is_verified,
    dur: +t.duration || 0,
    genre: t.genre || "", mood: t.mood || "",
    plays: +t.play_count || 0, likes: +t.favorite_count || 0,
    release: (t.release_date || "").slice(0, 10),
    art:   a["480x480"] || a["150x150"] || "",
    artHi: a["1000x1000"] || a["480x480"] || "",
    artSm: a["150x150"] || a["480x480"] || "",
    itArt: null,                 // enriched later by the matcher
    permalink: t.permalink ? "https://audius.co" + t.permalink : null,
    streamable: t.is_streamable !== false,
  });
}
const TList = (arr) => (Array.isArray(arr) ? arr.map(T).filter(Boolean) : []);

/* ================================================================
   §4 · components/toast.js + icon refresh helper
   ================================================================ */
function refreshIcons(root = document) {
  try { if (window.lucide) lucide.createIcons({ root: root instanceof Element ? root : document }); } catch (_) {}
}

const Toast = {
  show(msg, icon = "info", ms = 3200) {
    const root = $("#toast-root");
    const el = document.createElement("div");
    el.className = "toast pointer-events-auto flex items-center gap-2.5 bg-[#1B2B52] border border-line rounded-xl px-4 py-3 text-sm shadow-[0_16px_50px_-12px_rgba(0,0,0,.8)]";
    el.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 text-pink shrink-0"></i><span>${esc(msg)}</span>`;
    root.appendChild(el);
    refreshIcons(el);
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 350); }, ms);
  },
};

/* range input fill painter (webkit needs --fill var) */
function paintRange(input) {
  const min = +input.min || 0, max = +input.max || 100, v = +input.value || 0;
  input.style.setProperty("--fill", ((v - min) / (max - min)) * 100 + "%");
}
document.addEventListener("input", (e) => { if (e.target.matches('input[type="range"].ag')) paintRange(e.target); });

/* ================================================================
   CONFIG — public API settings
   ----------------------------------------------------------------
   Afterglow works out of the box with the public, read-only Audius
   API (identified only by `app_name`, verified against the live API)
   and the key-less iTunes Search API.
   OPTIONAL: register a free Audius API key at https://api.audius.co/plans
   and expose it as  window.AFTERGLOW_AUDIUS_KEY  before this script
   runs (or paste it below) to raise rate limits. Never paste a
   secret/Bearer token here — frontend code is public by nature.
   ================================================================ */
const CONFIG = {
  appName: "AvaTune",
  audiusAppName: "avatune",
  audiusKey: (window.AFTERGLOW_AUDIUS_KEY || "").trim() || null,
  audiusHosts: [
    "https://api.audius.co",                 // primary (official gateway)
    "https://discoveryprovider.audius.co",   // classic discovery node
    "https://audius-discovery-1.theblueprint.xyz",
    "https://audius-disco.derek-xu.com",
  ],
};

/* small in-memory response cache (TTL) to avoid duplicate API calls */
const Mem = {
  m: new Map(),
  get(k) { const e = this.m.get(k); if (!e) return null; if (Date.now() > e.exp) { this.m.delete(k); return null; } return e.val; },
  set(k, val, ttl = 120000) { this.m.set(k, { val, exp: Date.now() + ttl }); return val; },
};

async function fetchJSON(url, { timeout = 15000 } = {}) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeout);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) { const e = new Error("HTTP " + res.status); e.status = res.status; throw e; }
    return await res.json();
  } finally { clearTimeout(t); }
}

/* ================================================================
   §5 · api/audius.js — discovery, search & streaming source
   Response envelope is always { data: … }  (verified live)
   ================================================================ */
const Audius = {
  hostIdx: 0,
  get host() { return CONFIG.audiusHosts[this.hostIdx % CONFIG.audiusHosts.length]; },

  _url(path, params = {}) {
    const u = new URL(this.host + "/v1" + path);
    u.searchParams.set("app_name", CONFIG.audiusAppName);
    for (const [k, v] of Object.entries(params)) {
      if (v == null) continue;
      if (Array.isArray(v)) v.forEach((x) => u.searchParams.append(k, x));
      else u.searchParams.set(k, v);
    }
    if (CONFIG.audiusKey) u.searchParams.set("api_key", CONFIG.audiusKey);
    return u.toString();
  },

  /* fetch with failover across discovery hosts on network failure */
  async api(path, params = {}, attempt = 0) {
    const ck = "au:" + path + JSON.stringify(params);
    const hit = Mem.get(ck); if (hit) return hit;
    try {
      const j = await fetchJSON(this._url(path, params));
      return Mem.set(ck, j.data);
    } catch (err) {
      if (attempt < CONFIG.audiusHosts.length - 1) {
        this.hostIdx++;                        // rotate host & retry
        return this.api(path, params, attempt + 1);
      }
      throw err;
    }
  },

  async trending({ genre = null, time = "week", limit = 20, offset = 0 } = {}) {
    const data = await this.api("/tracks/trending", { genre, time, limit, offset });
    return TList(data).filter((t) => t.streamable);
  },
  async underground(limit = 12) {
    const data = await this.api("/tracks/trending/underground", { limit, offset: 0 });
    return TList(data).filter((t) => t.streamable);
  },
  async searchTracks(q, limit = 20) {
    const data = await this.api("/tracks/search", { query: q, limit });
    return TList(data).filter((t) => t.streamable);
  },
  async searchUsers(q, limit = 12) {
    return (await this.api("/users/search", { query: q, limit })) || [];
  },
  async user(id)    { return this.api("/users/" + id); },
  async userTracks(id, limit = 50) {
    const data = await this.api("/users/" + id + "/tracks", { limit });
    return TList(data).filter((t) => t.streamable);
  },
  async track(id)   { return T(await this.api("/tracks/" + id)); },
  async tracksByIds(ids = []) {
    if (!ids.length) return [];
    const data = await this.api("/tracks", { id: ids });
    return TList(data).filter((t) => t.streamable);
  },
  /* playlists double as albums on Audius (is_album flag) */
  normalizePlaylist(p) {
    if (!p) return null;
    const a = p.artwork || {}, u = p.user || {};
    return {
      src: "audius-playlist",
      id: p.id,
      name: p.playlist_name || "Untitled",
      desc: p.description || "",
      isAlbum: !!p.is_album,
      art:   a["480x480"] || a["150x150"] || "",
      artHi: a["1000x1000"] || a["480x480"] || "",
      owner: u.name || "Unknown", ownerId: u.id, ownerHandle: u.handle || "",
      likes: +p.favorite_count || 0, reposts: +p.repost_count || 0,
      totalPlays: +p.total_play_count || 0,
      release: (p.release_date || "").slice(0, 10),
      tracks: TList(p.tracks).filter((t) => t.streamable),
      permalink: `https://audius.co/${u.handle || ""}/playlist/${p.slug || ""}`,
    };
  },
  async playlist(id) { return this.normalizePlaylist(await this.api("/playlists/" + id)); },
  async trendingPlaylists(type = "playlist", limit = 10) {
    const data = await this.api("/playlists/trending", { type, limit, time: "week" });
    return (data || []).map((p) => this.normalizePlaylist(p)).filter(Boolean);
  },

  /* official streaming mechanism: the /stream endpoint 302-redirects
     to a signed content-node URL. HTMLAudioElement follows the redirect.
     Never persist the signed URL — request this fresh each play. */
  streamUrl(trackId) {
    const u = new URL(this.host + "/v1/tracks/" + trackId + "/stream");
    u.searchParams.set("app_name", CONFIG.audiusAppName);
    if (CONFIG.audiusKey) u.searchParams.set("api_key", CONFIG.audiusKey);
    return u.toString();
  },
};

/* ================================================================
   §6 · api/itunes.js — catalog metadata & artwork (no key needed)
   ================================================================ */
const ITunes = {
  base: "https://itunes.apple.com",
  art600(u) { return u ? u.replace(/\/\d+x\d+(bb)?\./, "/600x600bb.") : null; },
  async search(term, entity = "song", limit = 20) {
    const ck = `it:s:${entity}:${term}:${limit}`;
    const hit = Mem.get(ck); if (hit) return hit;
    const u = new URL(this.base + "/search");
    u.searchParams.set("term", term);
    u.searchParams.set("media", "music");
    u.searchParams.set("entity", entity);
    u.searchParams.set("limit", limit);
    const j = await fetchJSON(u.toString());
    return Mem.set(ck, j.results || [], 300000);
  },
  async lookup(id, entity = "song") {
    const ck = `it:l:${id}:${entity}`;
    const hit = Mem.get(ck); if (hit) return hit;
    const u = new URL(this.base + "/lookup");
    u.searchParams.set("id", id);
    if (entity) u.searchParams.set("entity", entity);
    const j = await fetchJSON(u.toString());
    return Mem.set(ck, j.results || [], 600000);
  },
};

/* ================================================================
   §7 · api/musicMatcher.js — high-confidence Audius ⇄ iTunes match
   ----------------------------------------------------------------
   Normalizes punctuation/case/diacritics, scores title & artist
   agreement, and only adopts iTunes artwork when confidence is high.
   Never invents metadata: misses fall back to Audius artwork.
   ================================================================ */
const normTxt = (s) =>
  String(s || "")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase().replace(/&/g, " and ")
    .replace(/\((feat|ft)\.[^)]*\)/gi, "")
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\s+/g, " ").trim();

const Matcher = {
  titleScore(a, b) {
    const x = normTxt(a), y = normTxt(b);
    if (!x || !y) return 0;
    if (x === y) return 3;
    if (x.includes(y) || y.includes(x)) return 1.5;
    const ta = new Set(x.split(" ")), tb = new Set(y.split(" "));
    const inter = [...ta].filter((w) => tb.has(w)).length;
    const j = inter / Math.max(ta.size, tb.size);
    return j >= 0.6 ? 1 : 0;
  },
  artistScore(a, b) {
    const x = normTxt(a), y = normTxt(b);
    if (!x || !y) return 0;
    if (x === y) return 3;
    if (x.includes(y) || y.includes(x)) return 2;
    const ta = new Set(x.split(" ")), tb = new Set(y.split(" "));
    const inter = [...ta].filter((w) => tb.has(w)).length;
    return inter / Math.max(ta.size, tb.size) >= 0.5 ? 1 : 0;
  },
  score(audTrack, it) {
    const ts = this.titleScore(audTrack.title, it.trackName);
    const as = this.artistScore(audTrack.artist, it.artistName);
    return { total: ts + as, ts, as };
  },
  confident(r) { return r.ts >= 1.5 && r.as >= 1.5 && r.total >= 3.5; },

  /* enrichment queue — max 3 concurrent requests, cached per track */
  _run: 0, _q: [], _done: new Map(),
  enrich(track, priority = false) {
    if (!track || track._enrichState === "ok" || track._enrichState === "none") return Promise.resolve(track);
    if (track._enrichState === "pending") return track._enrichPromise;
    track._enrichState = "pending";
    track._enrichPromise = new Promise((resolve) => {
      const job = async () => {
        try {
          const results = await ITunes.search(`${track.artist} ${track.title}`, "song", 6);
          let best = null, bestR = null;
          for (const it of results) {
            const r = this.score(track, it);
            if (!bestR || r.total > bestR.total) { best = it; bestR = r; }
          }
          if (best && this.confident(bestR)) {
            track.itArt   = this.artSafe(best.artworkUrl100) || track.itArt;
            track.itAlbum = best.collectionName || null;
            track.itGenre = best.primaryGenreName || null;
            track.itUrl   = best.trackViewUrl || null;
            track.itCollectionId = best.collectionId || null;
            track._enrichState = "ok";
          } else track._enrichState = "none";
        } catch (_) { track._enrichState = "none"; }
        emit("enrich", track);
        resolve(track);
      };
      (priority ? this._q.unshift(job) : this._q.push(job));
      this._pump();
    });
    return track._enrichPromise;
  },
  _pump() {
    while (this._run < 3 && this._q.length) {
      const job = this._q.shift();
      this._run++;
      job().finally(() => { this._run--; this._pump(); });
    }
  },
  artSafe(u) { return ITunes.art600(u); },
  /* the artwork a card should display: verified iTunes match > Audius > fallback */
  bestArt(track, hi = false) {
    return track.itArt || (hi ? track.artHi : track.art) || FALLBACK_ART;
  },
};

/* ================================================================
   lyrics provider — lyrics.ovh public API; graceful empty state.
   Never fabricated: only real responses are rendered.
   ================================================================ */
const Lyrics = {
  async fetch(track) {
    const artist = (track.artist || "").split(/[,&]| feat\.? | ft\.? /i)[0].trim();
    const title  = (track.title || "").replace(/\((feat|ft)\.[^)]*\)/gi, "").trim();
    if (!artist || !title) return null;
    const ck = `lyr:${normTxt(artist)}|${normTxt(title)}`;
    const hit = Mem.get(ck); if (hit !== null && hit !== undefined) return hit;
    try {
      const j = await fetchJSON(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`, { timeout: 9000 });
      const text = (j.lyrics || "").trim();
      return Mem.set(ck, text || "", 600000);
    } catch (_) { return Mem.set(ck, "", 60000); }
  },
};

/* ================================================================
   §8 · audio/audioEngine.js — ONE shared Audio element app-wide
   Events: play, pause, timeupdate, loadedmetadata, durationchange,
   ended, waiting, playing, error  →  all sync the UI via the Bus.
   ================================================================ */
const audio = document.getElementById("audio");

const Player = {
  queue: [],            // [track,...]  (metadata only — no stored stream URLs)
  index: -1,
  ctxName: null,
  shuffle: !!Store.data.prefs.shuffle,
  repeat: Store.data.prefs.repeat || "off",   // off | all | one
  history: [],          // shuffle back-stack
  seeking: false,
  dirty: false,         // queue restored from disk but media not loaded yet
  _errStreak: 0,

  get current() { return this.queue[this.index] || null; },
  get playing() { return !audio.paused && !audio.ended; },
  get hasNext() { return this.queue.length > 1; },

  /* ---- queue construction ---- */
  playFrom(ctx, trackId, { shuffle = false } = {}) {
    const ids = Cache.lists.get(ctx) || [];
    const tracks = ids.map((id) => Cache.tracks.get(id)).filter(Boolean);
    if (!tracks.length) return;
    this.queue = tracks;
    this.ctxName = ctx;
    this.history = [];
    let i = tracks.findIndex((t) => t.id === trackId);
    if (i < 0) i = 0;
    if (shuffle) { /* start on chosen track, randomize the rest naturally */ }
    this.index = i;
    this._persist();
    this.loadTrack(this.current, true);
  },

  playTracks(tracks, startIdx = 0, ctxName = null) {
    this.queue = tracks.filter(Boolean);
    this.ctxName = ctxName || Cache.newCtx("ad-hoc");
    Cache.list(this.ctxName, this.queue);
    this.index = clamp(startIdx, 0, this.queue.length - 1);
    this.history = [];
    this._persist();
    this.loadTrack(this.current, true);
  },

  addToQueue(track, { next = false } = {}) {
    if (!track) return;
    if (!this.queue.length) { this.playTracks([track], 0); return; }
    const at = next ? this.index + 1 : this.queue.length;
    this.queue.splice(at, 0, track);
    if (at <= this.index) this.index++;   // insert before current → shift
    this._persist();
    emit("queue");
    Toast.show(next ? "Will play next" : "Added to queue", next ? "corner-down-right" : "list-plus");
  },
  removeAt(i) {
    if (i < 0 || i >= this.queue.length) return;
    this.queue.splice(i, 1);
    if (i < this.index) this.index--;
    if (this.queue.length === 0) { this.stopAll(); return; }
    if (i === this.index) { this.index = Math.min(i, this.queue.length - 1); this.loadTrack(this.current, true); return; }
    this._persist(); emit("queue");
  },
  move(i, j) {
    if (i === j || i < 0 || j < 0 || i >= this.queue.length || j >= this.queue.length) return;
    const [t] = this.queue.splice(i, 1);
    this.queue.splice(j, 0, t);
    if (this.index === i) this.index = j;
    else if (i < this.index && j >= this.index) this.index--;
    else if (i > this.index && j <= this.index) this.index++;
    this._persist(); emit("queue");
  },
  clearQueue(keepCurrent = true) {
    const cur = this.current;
    this.queue = keepCurrent && cur ? [cur] : [];
    this.index = cur && keepCurrent ? 0 : -1;
    this.history = [];
    this._persist(); emit("queue");
  },
  playAt(i) {
    if (i < 0 || i >= this.queue.length) return;
    if (this.shuffle && i !== this.index) this.history.push(this.index);
    this.index = i;
    this._persist();
    this.loadTrack(this.current, true);
  },

  /* ---- transport ---- */
  toggle() {
    if (!this.current) { Toast.show("Pick a track to start listening", "disc-3"); return; }
    if (this.dirty || !audio.getAttribute("src")) { this.loadTrack(this.current, true); return; }
    if (audio.paused) this._play(); else audio.pause();
  },
  _play() {
    const p = audio.play();
    if (p && p.catch) p.catch((err) => {
      if (err.name === "NotAllowedError") Toast.show("Tap play to start audio (browser autoplay policy)", "hand");
      else Toast.show("Playback failed — try again", "triangle-alert");
    });
  },
  loadTrack(track, autoplay) {
    if (!track) return;
    this.dirty = false;
    this._errStreak = 0;
    emit("loading", true);
    emit("track", track);
    document.body.classList.add("is-loading");
    audio.src = Audius.streamUrl(track.id);   // fresh signed redirect each play
    audio.load();
    if (autoplay) this._play();
  },
  next(auto = false) {
    if (!this.queue.length) return;
    if (this.repeat === "one" && auto) { audio.currentTime = 0; this._play(); return; }
    let ni = -1;
    if (this.shuffle && this.queue.length > 1) {
      this.history.push(this.index);
      const pool = this.queue.map((_, i) => i).filter((i) => i !== this.index);
      ni = pool[Math.floor(Math.random() * pool.length)];
    } else ni = this.index + 1;
    if (ni >= this.queue.length) {
      if (this.repeat === "all" || !auto) ni = 0;
      else { audio.currentTime = 0; return; }          // end of queue with repeat off
    }
    this.index = ni;
    this._persist();
    this.loadTrack(this.current, true);
  },
  prev() {
    if (!this.queue.length) return;
    if (audio.currentTime > 4) { audio.currentTime = 0; return; }
    let pi;
    if (this.shuffle && this.history.length) pi = this.history.pop();
    else pi = this.index - 1 < 0 ? (this.repeat === "all" ? this.queue.length - 1 : 0) : this.index - 1;
    this.index = pi;
    this._persist();
    this.loadTrack(this.current, true);
  },
  seekTo(sec) { if (isFinite(audio.duration)) audio.currentTime = clamp(sec, 0, audio.duration); },
  stopAll() {
    audio.pause(); audio.removeAttribute("src"); audio.load();
    this.queue = []; this.index = -1; this.dirty = false;
    this._persist(); emit("queue"); emit("track", null);
  },

  /* ---- modes & volume ---- */
  setVolume(v) {
    v = clamp(+v, 0, 1);
    audio.volume = v;
    if (v > 0) audio.muted = false;
    Store.data.prefs.volume = v; Store.data.prefs.muted = audio.muted; Store.save();
    emit("prefs");
  },
  toggleMute() {
    audio.muted = !audio.muted;
    Store.data.prefs.muted = audio.muted; Store.save();
    emit("prefs");
  },
  toggleShuffle() {
    this.shuffle = !this.shuffle;
    this.history = [];
    Store.data.prefs.shuffle = this.shuffle; Store.save();
    emit("prefs");
    Toast.show(this.shuffle ? "Shuffle on" : "Shuffle off", "shuffle", 1600);
  },
  cycleRepeat() {
    this.repeat = { off: "all", all: "one", one: "off" }[this.repeat] || "off";
    Store.data.prefs.repeat = this.repeat; Store.save();
    emit("prefs");
    Toast.show({ off: "Repeat off", all: "Repeat all", one: "Repeat one" }[this.repeat], this.repeat === "one" ? "repeat-1" : "repeat", 1600);
  },
  _persist() {
    Store.data.queue = { ctx: this.ctxName, ids: this.queue.map((t) => t.id), index: this.index };
    Store.save();
    emit("queue");
  },
};

/* ---------- audio element → state sync ---------- */
audio.addEventListener("play",     () => { ensureAudioGraph(); resumeCtx(); startViz(); emit("playstate", true); if (Player.current) Library.pushRecent(Player.current); });
audio.addEventListener("pause",    () => { stopViz();  emit("playstate", false); });
audio.addEventListener("playing",  () => { document.body.classList.remove("is-loading"); emit("loading", false); Player._errStreak = 0; });
audio.addEventListener("waiting",  () => { document.body.classList.add("is-loading");    emit("loading", true); });
audio.addEventListener("ended",    () => Player.next(true));
audio.addEventListener("timeupdate", () => emit("time", { cur: audio.currentTime, dur: audio.duration || Player.current?.dur || 0 }));
audio.addEventListener("durationchange", () => emit("time", { cur: audio.currentTime, dur: audio.duration || 0 }));
audio.addEventListener("loadedmetadata", () => emit("time", { cur: audio.currentTime, dur: audio.duration || 0 }));
audio.addEventListener("error", () => {
  document.body.classList.remove("is-loading"); emit("loading", false);
  if (!Player.current || !audio.getAttribute("src")) return;
  Player._errStreak++;
  if (Player._errStreak <= 2 && Player.hasNext) {
    Toast.show("This track could not be streamed — skipping", "unplug");
    setTimeout(() => Player.next(true), 400);
  } else {
    Player._errStreak = 0;
    Toast.show("Stream unavailable for this track", "cloud-off");
  }
});

/* restore volume prefs */
audio.volume = clamp(Store.data.prefs.volume ?? 0.8, 0, 1);
audio.muted  = !!Store.data.prefs.muted;

/* ================================================================
   §9a · audio/visualizer.js — Web Audio analyser w/ CSS fallback
   ================================================================ */
let actx = null, analyser = null, vizOK = false, vizRAF = 0, vizBars = [];
function buildVizBars() {
  vizBars = [];
  const el = $("#viz");
  if (!el) return;
  el.innerHTML = "";
  for (let i = 0; i < 6; i++) {
    const b = document.createElement("span");
    b.className = "eqbar";
    el.appendChild(b);
    vizBars.push(b);
  }
}
function ensureAudioGraph() {
  if (actx || vizOK === "failed") return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error("no-web-audio");
    actx = new AC();
    const srcNode = actx.createMediaElementSource(audio);
    analyser = actx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.82;
    srcNode.connect(analyser);
    analyser.connect(actx.destination);
    vizOK = true;
  } catch (_) { vizOK = "failed"; }
}
function resumeCtx() { if (actx && actx.state === "suspended") actx.resume().catch(() => {}); }
const FAKE_OFF = () => { const v = $("#viz"); v?.classList.remove("eqfake"); v?.classList.add("eqpaused"); };

/* --- Now Playing canvas visualizer: real spectrum (Web Audio) with
       a graceful animated fallback, rounded pink-gradient bars and a
       soft floor reflection. CPU-friendly: single rAF, DPR-capped. --- */
let vizCanvas = null;
function drawCanvasViz(data, now = 0, idle = false) {
  if (!vizCanvas) vizCanvas = $("#np-viz");
  if (!vizCanvas) return;
  const c = vizCanvas, ctx = c.getContext("2d");
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const base = h * 0.8;
  const bw = 4, gap = 3;
  const count = clamp(Math.floor(w / (bw + gap)), 24, 96);
  const x0 = (w - count * (bw + gap) + gap) / 2;
  const grad = ctx.createLinearGradient(0, 0, 0, base);
  grad.addColorStop(0, "#FFD3E6"); grad.addColorStop(0.4, "#FF8FBE"); grad.addColorStop(1, "#FF6FAE");
  ctx.fillStyle = grad;
  for (let i = 0; i < count; i++) {
    let v;
    if (idle) v = 0.05;
    else if (data) {
      const idx = Math.min(data.length - 1, Math.floor(Math.pow(i / count, 1.5) * data.length * 0.85));
      v = (data[idx] || 0) / 255;
    } else {
      v = clamp(0.34 + 0.26 * Math.sin(now / 430 + i * 0.5) + 0.16 * Math.sin(now / 270 + i * 1.35), 0.06, 1);
    }
    const bh = Math.max(2.5, v * (base - 6));
    const x = x0 + i * (bw + gap);
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, base - bh, bw, bh, 2); else ctx.rect(x, base - bh, bw, bh);
    ctx.fill();
    ctx.save(); ctx.globalAlpha = 0.15;   /* reflection */
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, base + 2, bw, Math.max(1.5, bh * 0.32), 2); else ctx.rect(x, base + 2, bw, bh * 0.32);
    ctx.fill(); ctx.restore();
  }
  ctx.fillStyle = "rgba(170,183,208,.18)";
  ctx.fillRect(0, base + 0.5, w, 1);
}

function startViz() {
  const bar = $("#viz");
  bar?.classList.remove("eqpaused");
  cancelAnimationFrame(vizRAF);
  const buf = analyser && vizOK === true ? new Uint8Array(analyser.frequencyBinCount) : null;
  bar?.classList.toggle("eqfake", !buf);
  const loop = (now) => {
    vizRAF = requestAnimationFrame(loop);
    if (buf) {
      analyser.getByteFrequencyData(buf);
      vizBars.forEach((el, i) => {
        const v = buf[Math.floor((i * buf.length) / Math.max(1, vizBars.length))] / 255;
        el.style.height = Math.max(10, v * 100) + "%";
      });
    }
    drawCanvasViz(buf, now || 0);
  };
  vizRAF = requestAnimationFrame(loop);
}
function stopViz() {
  cancelAnimationFrame(vizRAF);
  vizBars.forEach((el) => (el.style.height = ""));
  FAKE_OFF();
  drawCanvasViz(null, 0, true);
}

/* ================================================================
   §9b · storage operations — likes, playlists, recents
   ================================================================ */
const Library = {
  isLiked: (id) => !!Store.data.liked[id],
  toggleLike(track) {
    if (!track) return;
    const d = Store.data;
    if (d.liked[track.id]) {
      delete d.liked[track.id];
      d.likedOrder = d.likedOrder.filter((x) => x !== track.id);
      Toast.show("Removed from Liked Songs", "heart-off", 1800);
    } else {
      d.liked[track.id] = { track, at: Date.now() };
      d.likedOrder.unshift(track.id);
      Toast.show("Added to Liked Songs", "heart", 1800);
    }
    Store.save(); emit("library");
  },
  likedTracks() {
    const d = Store.data;
    return d.likedOrder.map((id) => d.liked[id] && d.liked[id].track).filter(Boolean);
  },
  pushRecent(track) {
    const d = Store.data;
    const last = d.recent[0];
    if (last && last.track.id === track.id) return;          // no spammy duplicates
    d.recent = d.recent.filter((r) => r.track.id !== track.id);
    d.recent.unshift({ track, at: Date.now() });
    if (d.recent.length > 60) d.recent.length = 60;
    Store.save(); emit("library");
  },
  createPlaylist(name, tracks = []) {
    const pl = { id: uid(), name: name || "New Playlist", createdAt: Date.now(), tracks };
    Store.data.playlists.unshift(pl);
    Store.save(); emit("library");
    return pl;
  },
  getPlaylist: (id) => Store.data.playlists.find((p) => p.id === id),
  renamePlaylist(id, name) {
    const pl = this.getPlaylist(id); if (!pl) return;
    pl.name = name || pl.name; Store.save(); emit("library");
  },
  deletePlaylist(id) {
    Store.data.playlists = Store.data.playlists.filter((p) => p.id !== id);
    Store.save(); emit("library");
  },
  addToPlaylist(id, track) {
    const pl = this.getPlaylist(id); if (!pl) return;
    if (pl.tracks.some((t) => t.id === track.id)) { Toast.show("Already in “" + pl.name + "”", "circle-check", 1800); return; }
    pl.tracks.push(track); Store.save(); emit("library");
    Toast.show("Added to “" + pl.name + "”", "list-plus", 1800);
  },
  removeFromPlaylist(id, trackId) {
    const pl = this.getPlaylist(id); if (!pl) return;
    pl.tracks = pl.tracks.filter((t) => t.id !== trackId);
    Store.save(); emit("library");
  },
};

          <i data-lucide="${it.icon}" class="w-4 h-4 ${it.danger ? "" : "text-mist"}"></i>${esc(it.label)}

      track.permalink ? { icon: "external-link", label: "Open on Audius", onClick: () => window.open(track.permalink, "_blank", "noopener") } : null,
    ].filter(Boolean));

};

function likeBtnState(btn, liked) {
  btn.classList.toggle("text-pink", liked);
  btn.classList.toggle("text-mist", !liked);
  const svgTarget = btn.querySelector("svg") || btn;
  btn.innerHTML = `<i data-lucide="heart" class="w-[18px] h-[18px] ${liked ? "fill-current heart-pop" : ""}"></i>`;
  refreshIcons(btn);
}

function volIcon(btn) {
  const v = audio.muted ? 0 : audio.volume;
  const name = v === 0 ? "volume-x" : v < 0.5 ? "volume-1" : "volume-2";
  btn.innerHTML = `<i data-lucide="${name}" class="w-[18px] h-[18px]"></i>`;
  refreshIcons(btn);
}

function syncTrackUI() {
  const t = Player.current;
  const art = t ? Matcher.bestArt(t) : FALLBACK_ART;
  // desktop bar
  $("#pb-art").src = art; $("#pb-art").onerror = () => imgFallback($("#pb-art"));
  $("#pb-title").textContent = t ? t.title : "Nothing playing";
  $("#pb-artist").textContent = t ? t.artist : "Pick something to listen to";
  $("#pb-artist").dataset.aid = t?.artistId || "";
  likeBtnState($("#pb-like"), t ? Library.isLiked(t.id) : false);
  // mini
  $("#mini").classList.toggle("hidden", !t);
  if (t) {
    $("#mp-art").src = Matcher.bestArt(t); $("#mp-art").onerror = () => imgFallback($("#mp-art"));
    $("#mp-title").textContent = t.title; $("#mp-artist").textContent = t.artist;
    likeBtnState($("#mp-like"), Library.isLiked(t.id));
  }
  // overlay
  if (t) {
    $("#np-art").src = Matcher.bestArt(t, true); $("#np-art").onerror = () => imgFallback($("#np-art"));
    $("#np-amb").src = Matcher.bestArt(t, true); $("#np-amb").onerror = () => ($("#np-amb").style.opacity = 0);
    if (!$("#np-amb").src || $("#np-amb").src === location.href) $("#np-amb").style.opacity = 0; else $("#np-amb").style.opacity = "";
    $("#np-title").textContent = t.title;
    $("#np-artist").textContent = t.artist + (t.verified ? " ✓" : "");
    $("#np-artist").dataset.aid = t.artistId || "";
    $("#np-meta").innerHTML = [
      t.genre && `<span class="px-2 py-0.5 rounded-full bg-white/5 border border-line">${esc(t.genre)}</span>`,
      t.mood && `<span class="px-2 py-0.5 rounded-full bg-white/5 border border-line">${esc(t.mood)}</span>`,
      t.plays ? `<span class="inline-flex items-center gap-1"><i data-lucide="play" class="w-3 h-3"></i>${fmtNum(t.plays)} plays</span>` : "",
      t.itAlbum ? `<span class="line-clamp-1">Album · ${esc(t.itAlbum)}</span>` : "",
      t.permalink ? `<a href="${t.permalink}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 hover:text-blush transition"><i data-lucide="external-link" class="w-3 h-3"></i>Audius</a>` : "",
    ].filter(Boolean).join("");
    likeBtnState($("#np-like"), Library.isLiked(t.id));
    refreshIcons($("#np-meta"));
    document.title = "AvaTune";
    if ("mediaSession" in navigator) {
      try { navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.itAlbum || "AvaTune", artwork: [{ src: Matcher.bestArt(t, true), sizes: "512x512" }] }); } catch (_) {}
    }

  } else document.title = "AvaTune";

  $$(".trow.playing").forEach((r) => r.classList.remove("playing"));

}

function iconInto(btn, name, cls) { if (!btn) return; btn.innerHTML = `<i data-lucide="${name}" class="${cls}"></i>`; refreshIcons(btn); }
function syncPlaystateUI(playing) {
  iconInto($("#pb-play"), playing ? "pause" : "play", "w-5 h-5 fill-current" + (playing ? "" : " ml-[2px]"));
  iconInto($("#mp-play"), playing ? "pause" : "play", "w-4 h-4 fill-current" + (playing ? "" : " ml-[1px]"));
  iconInto($("#np-play"), playing ? "pause" : "play", "w-7 h-7 fill-current" + (playing ? "" : " ml-[2px]"));
  $("#pb-play")?.setAttribute("aria-label", playing ? "Pause" : "Play");
  if (!playing) FAKE_OFF(); else if (vizOK !== true) startViz();
}

function syncTimeUI(cur, dur) {
  if (!Player.seeking) {
    const v = dur > 0 ? Math.round((cur / dur) * 1000) : 0;
    ["#pb-seek", "#np-seek"].forEach((s) => { const el = $(s); if (el) { el.value = v; paintRange(el); } });
    $("#mp-prog").style.width = (dur > 0 ? (cur / dur) * 100 : 0) + "%";
  }
  $("#pb-cur").textContent = fmtTime(cur); $("#np-cur").textContent = fmtTime(cur);
  const d = fmtTime(dur || Player.current?.dur || 0);
  $("#pb-dur").textContent = d; $("#np-dur").textContent = d;
}

function syncPrefsUI() {
  const shufC = Player.shuffle ? "text-pink" : "text-mist";
  ["#pb-shuffle", "#np-shuffle", "#mp-shuffle"].forEach((s) => { const b = $(s); if (b) { b.classList.remove("text-pink", "text-mist"); b.classList.add(shufC); } });
  const icon = Player.repeat === "one" ? "repeat-1" : "repeat";
  ["#pb-repeat", "#np-repeat", "#mp-repeat"].forEach((s) => {
    const b = $(s); if (!b) return;
    b.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i>` + (Player.repeat !== "off" ? '<span class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-pink"></span>' : "");
    b.classList.toggle("text-pink", Player.repeat !== "off");
    b.classList.toggle("text-mist", Player.repeat === "off");
    refreshIcons(b);
  });
  ["#pb-vol", "#np-vol"].forEach((s) => { const el = $(s); if (el) { el.value = audio.muted ? 0 : audio.volume; paintRange(el); } });
  volIcon($("#pb-mute")); volIcon($("#np-mute"));
}

/* ---- static control bindings ---- */
function bindPlayerUI() {
  buildVizBars();
  // play/pause (all three surfaces)
  [["#pb-play"], ["#mp-play"], ["#np-play"]].forEach(([s]) => $(s).addEventListener("click", (e) => { e.stopPropagation(); Player.toggle(); }));
  [["#pb-next"], ["#mp-next"], ["#np-next"]].forEach(([s]) => $(s).addEventListener("click", (e) => { e.stopPropagation(); Player.next(false); }));
  $("#mp-prev").addEventListener("click", (e) => { e.stopPropagation(); Player.prev(); });
  $("#mp-shuffle").addEventListener("click", () => Player.toggleShuffle());
  $("#mp-repeat").addEventListener("click", () => Player.cycleRepeat());
  [["#pb-prev"], ["#np-prev"]].forEach(([s]) => $(s).addEventListener("click", () => Player.prev()));
  [["#pb-shuffle"], ["#np-shuffle"]].forEach(([s]) => $(s).addEventListener("click", () => Player.toggleShuffle()));
  [["#pb-repeat"], ["#np-repeat"]].forEach(([s]) => $(s).addEventListener("click", () => Player.cycleRepeat()));
  // likes
  [["#pb-like"], ["#mp-like"], ["#np-like"]].forEach(([s]) => $(s).addEventListener("click", (e) => { e.stopPropagation(); if (Player.current) Library.toggleLike(Player.current); }));
  // seeks
  ["#pb-seek", "#np-seek"].forEach((s) => {
    const el = $(s);
    el.addEventListener("pointerdown", () => (Player.seeking = true));
    el.addEventListener("input", () => { const d = audio.duration || Player.current?.dur || 0; ($(s === "#pb-seek" ? "#pb-cur" : "#np-cur")).textContent = fmtTime((el.value / 1000) * d); });
    el.addEventListener("change", () => {
      const d = audio.duration || Player.current?.dur || 0;
      Player.seekTo((el.value / 1000) * d);
      Player.seeking = false;
    });
  });
  // volumes
  ["#pb-vol", "#np-vol"].forEach((s) => $(s).addEventListener("input", (e) => Player.setVolume(e.target.value)));
  [["#pb-mute"], ["#np-mute"]].forEach(([s]) => $(s).addEventListener("click", () => Player.toggleMute()));
  // overlay open/close
  const openNp = () => { $("#np").classList.add("open"); renderNpQueue(); };
  $("#pb-expand").addEventListener("click", openNp);
  $("#pb-art-btn").addEventListener("click", openNp);
  $("#mini").addEventListener("click", (e) => { if (!e.target.closest("button")) openNp(); });
  $("#np-close").addEventListener("click", () => $("#np").classList.remove("open"));
  $("#np-menu").addEventListener("click", (e) => { if (Player.current) Menu.forTrack(Player.current, e.clientX - 180, e.clientY - 10); });
  $("#pb-queue").addEventListener("click", () => (location.hash = "#/queue"));
  $("#pb-lyrics").addEventListener("click", () => { openNp(); switchNpTab("lyrics"); });
  // overlay tabs
  $$(".np-tab").forEach((b) => b.addEventListener("click", () => switchNpTab(b.dataset.tab)));
  // artist links
  $("#pb-artist").addEventListener("click", () => { const id = $("#pb-artist").dataset.aid; if (id) location.hash = "#/artist/" + id; });
  $("#np-artist").addEventListener("click", () => { const id = $("#np-artist").dataset.aid; if (id) { $("#np").classList.remove("open"); location.hash = "#/artist/" + id; } });
}

function switchNpTab(tab) {
  $$(".np-tab").forEach((b) => {
    const on = b.dataset.tab === tab;
    b.classList.toggle("bg-pink", on); b.classList.toggle("text-white", on);
    b.classList.toggle("bg-white/5", !on); b.classList.toggle("text-mist", !on);
  });
  $("#np-queue-panel").classList.toggle("hidden", tab !== "queue");
  $("#np-lyrics-panel").classList.toggle("hidden", tab !== "lyrics");
  if (tab === "lyrics") loadLyricsPanel();
}

function renderNpQueue() {
  const el = $("#np-queue-panel");
  if (!el) return;
  const q = Player.queue;
  if (!q.length) { el.innerHTML = `<p class="text-sm text-mist py-4 text-center">Queue is empty</p>`; return; }
  el.innerHTML = q.map((t, i) => `
    <button class="npq w-full flex items-center gap-2.5 p-2 rounded-lg text-left transition ${i === Player.index ? "bg-pink/10" : "hover:bg-white/5"}" data-q="${i}">

let lyricReq = 0;
function resetLyricsPanel() {
  const el = $("#np-lyrics-panel");
  el.dataset.track = Player.current?.id || "";
  el.innerHTML = `<div class="flex flex-col items-center gap-3 py-8 text-mist"><i data-lucide="mic-vocal" class="w-6 h-6"></i><p class="text-sm">Open the Lyrics tab to load words for this track.</p></div>`;
  refreshIcons(el);
}
async function loadLyricsPanel() {
  const t = Player.current, el = $("#np-lyrics-panel");
  if (!t) return;
  if (el.dataset.track === t.id && el.dataset.done === "1") return;
  const req = ++lyricReq;
  el.innerHTML = `<div class="space-y-2.5 py-2">${'<div class="sk h-3.5 rounded w-full"></div>'.repeat(1)}${'<div class="sk h-3.5 rounded w-11/12"></div>'.repeat(4)}${'<div class="sk h-3.5 rounded w-3/4"></div>'}</div>`;
  const text = await Lyrics.fetch(t);
  if (req !== lyricReq || !Player.current || Player.current.id !== t.id) return;
  el.dataset.done = "1";
  if (text) {
    el.innerHTML = `<pre class="whitespace-pre-wrap font-body text-sm leading-7 text-mist">${esc(text)}</pre>
      <p class="mt-4 text-[10px] text-mist/60 uppercase tracking-widest">Lyrics via lyrics.ovh</p>`;
  } else {
    el.innerHTML = `<div class="flex flex-col items-center gap-3 py-10 text-mist text-center">
      <i data-lucide="file-x-2" class="w-7 h-7"></i>
      <p class="text-sm font-medium text-white/80">No lyrics available</p>
      <p class="text-xs max-w-xs">We only display lyrics from a live licensed source — none were found for this track.</p></div>`;
    refreshIcons(el);
  }
}

/* ---- media session + keyboard shortcuts ---- */
function bindShortcuts() {
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("play",  () => Player.toggle());
      navigator.mediaSession.setActionHandler("pause", () => Player.toggle());
      navigator.mediaSession.setActionHandler("previoustrack", () => Player.prev());
      navigator.mediaSession.setActionHandler("nexttrack",     () => Player.next(false));
    } catch (_) {}
  }
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t.closest('input, textarea, select, [contenteditable="true"]')) return;   // never hijack typing
    switch (e.code) {
      case "Space":      e.preventDefault(); Player.toggle(); break;
      case "ArrowLeft":  e.preventDefault(); Player.seekTo(audio.currentTime - 5); break;
      case "ArrowRight": e.preventDefault(); Player.seekTo(audio.currentTime + 5); break;
      case "ArrowUp":    e.preventDefault(); Player.setVolume(audio.volume + 0.05); break;
      case "ArrowDown":  e.preventDefault(); Player.setVolume(audio.volume - 0.05); break;
      case "KeyM":       Player.toggleMute(); break;
      case "KeyN":       if (e.shiftKey) { Player.next(false); } break;
    }
  });
}

/* ================================================================
   global delegation — row/card actions (never double-bound: one
   listener for the whole app, elements re-render freely)
   ================================================================ */
function backBtn() {
  return `<button data-act="back" aria-label="Back" title="Back"
    class="inline-flex items-center gap-1.5 pr-4 pl-2.5 py-2 rounded-full text-sm font-medium text-mist hover:text-white transition bg-white/5 border border-line hover:border-pink/50 hover:bg-pink/10 mb-5">
    <i data-lucide="chevron-left" class="w-4 h-4"></i>Back</button>`;
}

function bindGlobalDelegation() {
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act !== "play") e.stopPropagation();
    switch (act) {
      case "back": Router.back(); break;
      case "play": {
        const ctx = el.dataset.ctx, id = el.dataset.id;
        if (ctx && id) Player.playFrom(ctx, id);
        break;
      }
      case "play-ctx": {
        const ctx = el.dataset.ctx;
        const ids = Cache.lists.get(ctx) || [];
        if (ids.length) Player.playFrom(ctx, ids[0]);
        else Toast.show("Nothing to play yet", "circle-alert");
        break;
      }
      case "shuffle-ctx": {
        const ctx = el.dataset.ctx;
        const ids = Cache.lists.get(ctx) || [];
        if (ids.length) { const rand = ids[Math.floor(Math.random() * ids.length)]; Player.shuffle || Player.toggleShuffle(); Player.playFrom(ctx, rand.id || rand); }
        break;
      }
      case "like": {
        const t = Cache.tracks.get(el.dataset.id);
        if (t) Library.toggleLike(t);
        break;
      }
      case "menu": {
        const t = Cache.tracks.get(el.dataset.id);
        const extra = [];
        if (el.dataset.plremove) extra.push({ icon: "trash-2", label: "Remove from this playlist", danger: true, onClick: () => { Library.removeFromPlaylist(el.dataset.plremove, el.dataset.id); } });
        if (t) Menu.forTrack(t, e.clientX, e.clientY, extra);
        break;
      }
      case "artist": {
        const id = el.dataset.aid;
        if (id) location.hash = "#/artist/" + id;
        break;
      }
      case "genre": location.hash = "#/genre/" + encodeURIComponent(el.dataset.genre); break;
      case "it-play": itResolveAndPlay(el.dataset.title, el.dataset.artist, el.dataset.album || "", el.dataset.art || ""); break;
      case "quick-search": {
        location.hash = "#/search";
        SearchPage.setQuery(el.dataset.q);
        break;
      }
    }
  });
  /* keyboard-accessible rows */
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.classList?.contains("trow") && !e.target.closest("button")) e.target.click();
  });
  /* retry buttons inside error states */
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-retry]");
    if (b) Router.render(true);
  });
}

/* iTunes album track → resolve a playable Audius match on demand */
const ResolveCache = new Map();
async function itResolveAndPlay(title, artist, album, art) {
  const key = normTxt(title) + "|" + normTxt(artist);
  Toast.show("Finding “" + title + "” on Audius…", "loader-circle", 1500);
  if (ResolveCache.has(key)) {
    const t = ResolveCache.get(key);
    if (t) { const c = Cache.newCtx("it-album"); Cache.list(c, [t]); Player.playFrom(c, t.id); }
    else Toast.show("Not available for streaming on Audius", "cloud-off");
    return;
  }
  try {
    const candidates = await Audius.searchTracks(artist + " " + title, 6);
    const probe = { title, artist };
    let best = null, bestR = null;
    for (const c of candidates) {
      const r = Matcher.score({ title: c.title, artist: c.artist }, { trackName: probe.title, artistName: probe.artist });
      if (!bestR || r.total > bestR.total) { best = c; bestR = r; }
    }
    if (best && bestR.ts >= 1.5 && bestR.as >= 1.5) {
      if (art) { best.itArt = art; }   // artwork came from this exact iTunes album entry
      if (album) best.itAlbum = album;
      ResolveCache.set(key, best);
      const c = Cache.newCtx("it-album"); Cache.list(c, [best]);
      Player.playFrom(c, best.id);
    } else {
      ResolveCache.set(key, null);
      Toast.show("“" + title + "” isn't streamable on Audius", "cloud-off");
    }
  } catch (_) {
    Toast.show("Could not reach Audius — try again", "wifi-off");
  }
}

/* ================================================================
   §10c · pages/search.js — debounced, cancellable, with empty states
   ================================================================ */
const SearchPage = {
  q: "", reqSeq: 0,
  RECENTS_KEY: "afterglow.searches.v1",
  getRecents() { try { const r = JSON.parse(localStorage.getItem(this.RECENTS_KEY)); return Array.isArray(r) ? r.slice(0, 6) : []; } catch (_) { return []; } },
  pushRecent(q) {
    const r = [q, ...this.getRecents().filter((x) => x.toLowerCase() !== q.toLowerCase())].slice(0, 6);
    try { localStorage.setItem(this.RECENTS_KEY, JSON.stringify(r)); } catch (_) {}
  },
  setQuery(q) { this.q = q; const inp = $("#search-input"); if (inp) { inp.value = q; this.run(q); } },

  render(view) {
    view.innerHTML = `<div class="px-4 sm:px-6 lg:px-8 py-6 pb-36 lg:pb-32 max-w-[1400px] mx-auto">
      ${backBtn()}
      <h1 class="font-display font-extrabold text-3xl lg:text-4xl tracking-tight fade-up">Search</h1>
      <div class="relative mt-5 max-w-2xl fade-up">
        <i data-lucide="search" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-mist pointer-events-none"></i>
        <input id="search-input" type="search" value="${esc(this.q)}" placeholder="Songs, artists, albums on Audius…" autocomplete="off" spellcheck="false"
          class="w-full bg-deep border border-line rounded-2xl pl-12 pr-12 py-4 text-[15px] placeholder:text-mist/50 focus:border-pink/70 focus:bg-lift transition shadow-[0_12px_40px_-20px_rgba(0,0,0,.7)]" aria-label="Search music" />
        <button id="search-clear" class="hidden absolute right-3 top-1/2 -translate-y-1/2 p-1.5 rounded-full text-mist hover:text-white hover:bg-navy transition" aria-label="Clear search"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div id="search-results" class="mt-8"></div>
    </div>`;
    refreshIcons(view);
    const inp = $("#search-input"), clearBtn = $("#search-clear");
    const toggleClear = () => clearBtn.classList.toggle("hidden", !inp.value);
    inp.addEventListener("input", debounce(() => { toggleClear(); this.run(inp.value.trim()); }, 350));
    clearBtn.onclick = () => { inp.value = ""; toggleClear(); this.run(""); inp.focus(); };
    toggleClear();
    if (this.q) this.run(this.q); else this.browse($("#search-results"));
    if (!location.hash.includes("search")) return;
    setTimeout(() => { if (window.innerWidth > 1024) inp.focus({ preventScroll: true }); }, 60);
  },

  browse(el) {
    const recents = this.getRecents();
    el.innerHTML =
      (recents.length ? UI.section("Recent searches",
        `<div class="flex flex-wrap gap-2">${recents.map((q) => `<button data-act="quick-search" data-q="${esc(q)}" class="px-4 py-2 rounded-full bg-deep border border-line text-sm text-mist hover:text-white hover:border-pink/50 transition">${esc(q)}</button>`).join("")}</div>`) : "") +
      UI.section("Browse genres", `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">${GENRES.map((g) => genreTile(g)).join("")}</div>`);
    refreshIcons(el);
  },

  async run(q) {
    this.q = q;
    const el = $("#search-results");
    if (!el) return;
    if (!q) { this.browse(el); return; }
    const seq = ++this.reqSeq;
    el.innerHTML = `<div class="grid lg:grid-cols-[minmax(0,380px)_minmax(0,1fr)] gap-5"><div class="sk rounded-3xl h-64"></div>${UI.skelRows(6)}</div>
      <div class="mt-8">${UI.skelCards(6, true)}</div>`;
    this.pushRecent(q);
    try {
      const [tracks, users, itSongs, itAlbums] = await Promise.all([
        Audius.searchTracks(q, 18),
        Audius.searchUsers(q, 8),
        ITunes.search(q, "song", 6).catch(() => []),
        ITunes.search(q, "album", 8).catch(() => []),
      ]);
      if (seq !== this.reqSeq) return;
      if (!tracks.length && !users.length && !itSongs.length) {
        el.innerHTML = UI.empty("search-x", "No results for “" + q + "”", "Try a different spelling, an artist name, or browse genres below.", "");
        refreshIcons(el); return;
      }
      const ctx = Cache.list(Cache.newCtx("search"), tracks);
      tracks.slice(0, 4).forEach((t) => Matcher.enrich(t));
      {
        const cands = tracks.slice(0, 8);
        let best = null, bestScore = -1;
        for (const t of cands) {
          const r = Matcher.score({ title: t.title, artist: t.artist }, { trackName: q, artistName: "" });
          if (r.ts > bestScore) { bestScore = r.ts; best = t; }

      const top = tracks[0];

      el.innerHTML = `

            <div class="mt-4 font-display font-bold text-xl line-clamp-2">${esc(top.title)}</div>
            <button class="text-sm text-mist hover:text-blush transition mt-0.5" data-act="artist" data-aid="${top.artistId}">${esc(top.artist)} ${top.verified ? '<span class="text-pink">✓</span>' : ""}</button>
            <div class="mt-4 flex items-center gap-2.5">
              <button class="px-5 py-2.5 rounded-full bg-pink text-white text-sm font-semibold inline-flex items-center gap-2 hover:bg-blush hover:text-deep transition" data-act="play" data-id="${top.id}" data-ctx="${ctx}"><i data-lucide="play" class="w-4 h-4 fill-current"></i>Play</button>
              <button class="p-2.5 rounded-full border border-line text-mist hover:text-pink transition" data-act="like" data-id="${top.id}" aria-label="Like"><i data-lucide="heart" class="w-4 h-4 ${Library.isLiked(top.id) ? "fill-current text-pink" : ""}"></i></button>
              <button class="p-2.5 rounded-full border border-line text-mist hover:text-white transition" data-act="menu" data-id="${top.id}" aria-label="More"><i data-lucide="ellipsis" class="w-4 h-4"></i></button>
            </div>
          </div>` : ""}
          <div class="fade-up">
            <div class="flex items-center justify-between mb-3"><h2 class="font-display font-bold text-lg">Songs</h2>
              <button class="text-xs font-semibold text-mist hover:text-pink transition" data-act="play-ctx" data-ctx="${ctx}">Play all</button></div>
            <div class="rounded-2xl border border-line bg-deep/50 p-2">${tracks.slice(0, 7).map((t, i) => UI.trackRow(t, i, ctx)).join("")}</div>
          </div>
        </div>
        ${normUsers.length ? UI.section("Artists", UI.hScroll(users.map((u) => UI.artistCard(u)).join(""))) : ""}

      refreshIcons(el);
    } catch (err) {
      if (seq !== this.reqSeq) return;
      el.innerHTML = UI.errorState("Search is unavailable right now. The Audius network may be busy — please retry.", "search");
      refreshIcons(el);
    }
  },
};

    <span class="font-display font-bold text-[15px] sm:text-base tracking-tight">${esc(name)}</span>
    <i data-lucide="${icon}" class="absolute -bottom-2 -right-2 w-14 h-14 opacity-25 transition group-hover:opacity-45 group-hover:rotate-6" style="color:${color}"></i>
  </button>`;
